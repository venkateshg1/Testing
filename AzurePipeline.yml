trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: RunDockerImage
  jobs:
    - job:
      steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'dockerHubConnection'
            repository: 'venky3690/jpetstore'
            command: 'run'
            arguments: '-d -p 8085:8080 venky3690/jpetstore:latest'
